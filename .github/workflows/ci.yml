name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: the slow suite, every emitted combination, and the dependency audits.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      full-matrix:
        description: Build every emitted combination instead of a pairwise-covering set
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    name: Fast tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build --configuration Release -warnaserror
      - name: Test
        run: dotnet test --configuration Release --no-build

  slow:
    name: Slow tests (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      AUGUR_RUN_SLOW: '1'
      AUGUR_FULL_MATRIX: ${{ (github.event_name == 'schedule' || inputs.full-matrix) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: dotnet build --configuration Release
      - name: Emitted code, browsers, installed tool, and audits
        run: dotnet test tests/Augur.IntegrationTests --configuration Release --no-build
